name: sphere_player
description: Sphere Player - A seamless streaming companion app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.14.0
  webview_flutter_web: ^0.2.2+4
  http: ^1.2.0
  url_launcher: ^6.2.6
  flutter_web_plugins:
    sdk: flutter
  uni_links: ^0.5.1
  shared_preferences: ^2.2.3
  flutter_inappwebview: ^6.0.0
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
