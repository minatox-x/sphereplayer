name: Build Sphere Player

on:
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
#  ANDROID APK
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK — split per ABI (arm64, armeabi, x86_64)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info/android

      - name: Build APK — universal (single file)
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info/android-universal

      - name: Rename APKs for clarity
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk             SpherePlayer-universal.apk
          cp app-arm64-v8a-release.apk   SpherePlayer-arm64.apk   2>/dev/null || true
          cp app-armeabi-v7a-release.apk SpherePlayer-arm32.apk   2>/dev/null || true
          cp app-x86_64-release.apk      SpherePlayer-x86_64.apk  2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/SpherePlayer-universal.apk
            build/app/outputs/flutter-apk/SpherePlayer-arm64.apk
            build/app/outputs/flutter-apk/SpherePlayer-arm32.apk
            build/app/outputs/flutter-apk/SpherePlayer-x86_64.apk
          retention-days: 30
          if-no-files-found: warn

# ─────────────────────────────────────────────────────────────────────────────
#  WINDOWS EXE
# ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows EXE
    # windows-2022 ships with Visual Studio 2022 — required for flutter build windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Repair Windows platform scaffolding
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release (obfuscated)
        run: |
          flutter build windows `
            --release `
            --obfuscate `
            --split-debug-info=build/debug-info/windows

      - name: Package into ZIP
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $out = "dist\SpherePlayer-Windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Force "$src\*" "$out\"
          Compress-Archive -Path "$out\*" `
                           -DestinationPath "dist\SpherePlayer-Windows.zip" `
                           -Force
          Write-Host "Packaged: dist\SpherePlayer-Windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/SpherePlayer-Windows.zip
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
#  RELEASE  (tag builds only)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # required to create releases

    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: artifacts/android

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sphere Player ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/android/SpherePlayer-universal.apk
            artifacts/android/SpherePlayer-arm64.apk
            artifacts/android/SpherePlayer-arm32.apk
            artifacts/android/SpherePlayer-x86_64.apk
            artifacts/windows/SpherePlayer-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
